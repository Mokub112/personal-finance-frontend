<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111B4D">
<title>Dashboard Personal Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/budget.css">
</head>
<body data-page="budget">
<div id="app-header"></div>
<main id="main">
<!-- PAGE:START -->
<section class="page" id="page-budget">
  <div class="page-head">
    <div><h1 class="page-title">วางแผนงบประมาณ</h1><p class="page-sub" data-sub></p></div>
    <div class="page-tools"><div data-month-nav></div><button type="button" class="btn btn-primary" onclick="Pages.budget.openForm()"><span data-icon="plus"></span>เพิ่มหมวดงบ</button></div>
  </div>
  <div data-summary></div>
  <div class="budget-grid" data-grid></div>

  <div class="modal-overlay" id="bud-modal" role="dialog" aria-modal="true" aria-labelledby="bud-title"><div class="modal">
    <div class="modal-head"><h2 id="bud-title">เพิ่มหมวดงบประมาณ</h2><button type="button" class="icon-btn" data-close aria-label="ปิด"><span data-icon="close"></span></button></div>
    <div class="field"><label for="bud-cat">หมวดหมู่</label><select id="bud-cat"></select></div>
    <div class="field-row">
      <div class="field"><label for="bud-limit">งบที่ตั้งไว้ (บาท)</label><input id="bud-limit" type="number" inputmode="decimal" min="0" placeholder="0"></div>
      <div class="field"><label for="bud-used">ใช้ไปแล้ว (บาท)</label><input id="bud-used" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    </div>
    <div class="form-error" id="bud-error" role="alert" hidden></div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" id="bud-save">บันทึก</button></div>
  </div></div>

  <div class="modal-overlay" id="rec-modal" role="dialog" aria-modal="true" aria-labelledby="rec-title"><div class="modal">
    <div class="modal-head"><h2 id="rec-title">บันทึกรายจ่าย</h2><button type="button" class="icon-btn" data-close aria-label="ปิด"><span data-icon="close"></span></button></div>
    <p class="modal-note" id="rec-note"></p>
    <div class="field"><label for="rec-amount">จำนวนที่ใช้เพิ่ม (บาท)</label><input id="rec-amount" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    <div class="form-error" id="rec-error" role="alert" hidden></div>
    <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>ยกเลิก</button><button type="button" class="btn btn-primary" id="rec-save">บันทึก</button></div>
  </div></div>
</section>
<!-- PAGE:END -->
</main>
<div id="modal-root"></div>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/budget.js"></script>
</body>
</html>
