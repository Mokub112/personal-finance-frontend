<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111B4D">
<title>รายรับ–รายจ่าย — Dashboard Personal Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/transactions.css">
</head>
<body data-page="transactions">
<div id="app-header"></div>
<main id="main">
<!-- PAGE:START -->
<section class="page" id="page-transactions">
  <div class="page-head">
    <div><h1 class="page-title">รายรับ–รายจ่าย</h1><p class="page-sub">บันทึกและติดตามทุกการเคลื่อนไหวของเงิน</p></div>
    <div class="page-tools"><div data-month-nav></div><button type="button" class="btn btn-primary hide-sm" onclick="TxModal.open()"><span data-icon="plus"></span>เพิ่มรายการ</button></div>
  </div>
  <div class="sum-strip" data-sum></div>
  <div class="toolbar">
    <label class="search"><span class="sr-only">ค้นหารายการ</span><span data-icon="search"></span><input type="search" data-search placeholder="ค้นหาชื่อรายการหรือหมวดหมู่" autocomplete="off"></label>
    <div class="seg" data-type aria-label="กรองประเภท"><button type="button" data-t="all" class="on">ทั้งหมด</button><button type="button" data-t="income">รายรับ</button><button type="button" data-t="expense">รายจ่าย</button></div>
  </div>
  <div class="card table">
    <div class="t-head"><span>รายการ</span><span>หมวดหมู่</span><span>วันที่</span><span class="r">จำนวนเงิน</span><span></span></div>
    <div data-rows></div>
  </div>
  <button type="button" class="fab" data-icon="plus" onclick="TxModal.open()" aria-label="เพิ่มรายการ"></button>
</section>
<!-- PAGE:END -->
</main>
<div id="modal-root"></div>
<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/transactions.js"></script>
</body>
</html>
